title: Workflow change followed by secret use and unexpected runner egress
id: lotp-workflow-secret-egress-v1
status: experimental
scope: joined source-control, CI, and network telemetry
description: Correlates the demonstrated build-poisoning chain by commit and run identifier.
window: 15m
join_keys:
  - repository
  - commit
  - run_id
sequence:
  - event_kind: git.change
    changed_path_matches: [.gitea/workflows/**, .github/workflows/**, Jenkinsfile, .gitlab-ci.yml]
  - event_kind: ci.run
    secret_context_used: true
  - event_kind: network.connection
    destination_allowed: false
severity: critical
triage:
  - Pause artifact promotion and affected deployments.
  - Preserve the workflow definition, runner logs, and network evidence.
  - Enumerate secrets and job-token permissions available to the run.
  - Scope artifacts produced from the commit and later descendants.

